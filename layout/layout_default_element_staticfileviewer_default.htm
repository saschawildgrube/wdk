<style>
/* Keep sizing local to the viewer. The surrounding page and navigation retain
   their normal document flow. Layouts can override the pane height if needed. */
.wdk-staticfileviewer
{
	box-sizing: border-box;
	width: 100%;
	max-width: 100%;
	min-width: 0;
	padding-bottom: 10px;
}

.wdk-staticfilebrowser-filename
{
	overflow-wrap: anywhere;
}

.wdk-staticfileviewer > .wdk-staticfileviewer-text
{
	box-sizing: border-box;
	width: 100%;
	max-width: 100%;
	min-width: 0;
	height: var(--wdk-staticfileviewer-height, 50vh);
	height: var(--wdk-staticfileviewer-height, 50dvh);
	min-height: 0;
	margin-bottom: 0;
	white-space: pre;
	overflow-wrap: normal;
	word-break: normal;
	overflow: auto;
	overscroll-behavior: contain;
}
</style>
<div class="wdk-staticfileviewer">
	<pre class="wdk-staticfileviewer-text" tabindex="0">{STATICFILEVIEWER_TEXT}</pre>
</div>
